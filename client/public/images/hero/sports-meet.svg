<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#fffaf2"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#681416" stroke-width="2" rx="6"/>
  
  <!-- Stylized Sports Track lines -->
  <path d="M 50 420 C 150 420, 200 380, 200 250 C 200 120, 150 80, 50 80" fill="none" stroke="#e7d2ad" stroke-width="12" opacity="0.5"/>
  <path d="M 50 400 C 130 400, 180 360, 180 250 C 180 140, 130 100, 50 100" fill="none" stroke="#c49b63" stroke-width="12" opacity="0.4"/>
  <path d="M 50 380 C 110 380, 160 340, 160 250 C 160 160, 110 120, 50 120" fill="none" stroke="#8f1f22" stroke-width="12" opacity="0.15"/>

  <!-- Olympic Torch or Laurel Leaf graphic -->
  <path d="M 400 180 L 400 240 L 390 240 L 395 180 Z" fill="#8f1f22" opacity="0.7"/>
  <path d="M 400 180 C 385 160, 395 140, 400 130 C 405 140, 415 160, 400 180 Z" fill="#c49b63" opacity="0.8"/>
  <path d="M 390 190 C 375 180, 385 160, 390 150" fill="none" stroke="#8f1f22" stroke-width="2" opacity="0.6"/>

  <!-- Laurel Wreath -->
  <path d="M 360 240 C 350 200 370 170 385 170" fill="none" stroke="#681416" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 440 240 C 450 200 430 170 415 170" fill="none" stroke="#681416" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <text x="50%" y="360" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="bold" fill="#3f0d0f">Annual Sports Meet</text>
  <text x="50%" y="400" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" tracking="0.15em" fill="#756b64" text-transform="uppercase">Vasant Valley School</text>
</svg>
