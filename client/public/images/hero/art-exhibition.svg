<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#fffaf2"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#681416" stroke-width="2" rx="6"/>
  
  <!-- Stylized Easel -->
  <path d="M 400 80 L 330 300 M 400 80 L 470 300 M 400 80 L 400 320" stroke="#681416" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 300 230 L 500 230" stroke="#681416" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Canvas Painting (Abstract shapes) -->
  <rect x="320" y="110" width="160" height="110" fill="#fffaf2" stroke="#681416" stroke-width="2"/>
  <circle cx="370" cy="150" r="25" fill="#e7d2ad" opacity="0.8"/>
  <circle cx="430" cy="170" r="20" fill="#8f1f22" opacity="0.7"/>
  <path d="M 330 200 C 370 170, 400 180, 470 190" fill="none" stroke="#c49b63" stroke-width="3" opacity="0.7"/>

  <!-- Palette overlay/details -->
  <path d="M 460 250 C 490 250, 520 280, 480 300 C 450 310, 430 270, 460 250 Z" fill="#e7d2ad" opacity="0.6" stroke="#c49b63" stroke-width="1"/>
  <circle cx="475" cy="270" r="5" fill="#8f1f22"/>
  <circle cx="490" cy="280" r="4" fill="#3f0d0f"/>
  <circle cx="465" cy="285" r="4" fill="#c49b63"/>

  <text x="50%" y="360" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="bold" fill="#3f0d0f">Student Art Exhibition</text>
  <text x="50%" y="400" text-anchor="middle" font-family="'Source Sans 3', Arial, sans-serif" font-size="16" font-weight="600" tracking="0.15em" fill="#756b64" text-transform="uppercase">Vasant Valley School</text>
</svg>
