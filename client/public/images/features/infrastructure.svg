<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#fffaf2"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#681416" stroke-width="2" rx="6"/>
  
  <!-- Architectural Sandstone Arches -->
  <path d="M 200 350 L 200 230 C 200 170, 300 170, 300 230 L 300 350" fill="none" stroke="#c49b63" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 350 350 L 350 200 C 350 130, 450 130, 450 200 L 450 350" fill="none" stroke="#681416" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M 500 350 L 500 230 C 500 170, 600 170, 600 230 L 600 350" fill="none" stroke="#c49b63" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Ground foundation line -->
